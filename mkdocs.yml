site_name: Open Restaurant Protocol
site_description: Open standard for integrations in the Open Restaurant ecosystem.
site_url: https://openrestaurantprotocol.org/
exclude_docs: |
  diagrams/oauth/*.json
  diagrams/oauth/*.mjs
  changes/**
theme:
  name: material
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
nav:
  - Home: index.md
  - Authentication:
      - OAuth: auth/oauth.md
      - OAuth Requirements: auth/oauth-requirements.md
      - Building an MCP with OAuth: auth/mcp-oauth.md
  - Authorization:
      - Overview: authz/index.md
      - Userinfo (OIDC): authz/userinfo.md
      - Merchants: authz/merchants.md
  - Data Contracts:
      - Overview: data-contracts/index.md
  - Integrations:
      - MCP: integrations/mcp.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
  - mike
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_description: Padrão aberto para integrações do ecossistema Open Restaurant.
          theme:
            language: pt
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: black
                accent: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Alternar para modo escuro
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: black
                accent: indigo
                toggle:
                  icon: material/weather-night
                  name: Alternar para modo claro
          nav_translations:
            Home: Início
            Authentication: Autenticação
            OAuth Requirements: Requisitos do OAuth
            Building an MCP with OAuth: Como construir um MCP com OAuth
            Authorization: Autorização
            Overview: Visão geral
            Merchants: Lojas
            Data Contracts: Contratos de Dados
            Integrations: Integrações
extra:
  version:
    provider: mike
